# SERVER_NAME for PHP: a valid hostname, never nginx's catch-all `_`.
# http-context map, paired with the SERVER_NAME override in
# /etc/nginx/fastcgi_params (also shipped by this image). Included via the base
# image's `include /etc/nginx/conf.d/*.conf` in nginx.conf.template's http {}
# block.
#
# Why this exists
# ---------------
# SwiftMailer derives the SMTP EHLO/HELO argument from $_SERVER['SERVER_NAME']
# (vendor/swiftmailer/swiftmailer/lib/dependency_maps/transport_deps.php), with
# `[127.0.0.1]` as its fallback when that is empty. Its sanity check on the
# value accepts an underscore — and the base image's site config uses the nginx
# catch-all `server_name _;`, which fastcgi_params passes through verbatim. The
# result is `EHLO _` on every synchronous send, which strict relays reject:
#
#   >> EHLO _
#   << 501 Syntactically invalid EHLO argument(s)
#
# See pikapods/docker-freescout#1, freescout-help-desk/freescout#5455 and
# nfrastack/container-freescout#257 — the same bug in every image built on an
# nginx default-server config.
#
# Only synchronous (web-request) sends are affected. Queued mail runs under the
# CLI SAPI with no SERVER_NAME at all, and FreeScout's app/Console/Kernel.php
# fills it in from APP_URL for that path.
#
# Why $host
# ---------
# It is the request's Host header (port stripped, unlike $http_host), and
# FreeScout's TrustHosts middleware 403s any request whose Host does not match
# APP_URL — so on every request that can reach a send path, $host *is* APP_URL's
# host. That makes the web path agree with what the queue worker already
# announces, with no boot-time rendering and no service-ordering dependency.
#
# Whitelist, not blacklist: only a syntactically valid hostname or IP literal
# passes (SwiftMailer wraps IPs in brackets itself). Everything else — including
# the `_` that nginx substitutes for $host when a request carries no Host header
# — maps to the empty string, and the `if_not_empty` in fastcgi_params then
# omits SERVER_NAME entirely, leaving PHP in the same state the CLI is in.
map $host $freescout_server_name {
    default                                       "";
    "~^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$"  $host;
}
