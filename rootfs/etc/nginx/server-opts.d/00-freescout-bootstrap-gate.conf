# Boot gate. The FreeScout bootstrap (s6 oneshot) runs migrations and cache
# rebuilds while nginx + php-fpm are already accepting traffic; a request
# served against the half-migrated schema can poison /data/storage caches in
# ways that outlive the boot. While the sentinel exists — baked into the
# image, re-raised at bootstrap start, removed as the bootstrap's final step —
# answer everything except /healthcheck with a plain 500 so no request
# reaches the application mid-migration.
#
# The status must be 500, not 503: the container healthcheck has liveness
# semantics and treats only transport failures and 502/503/504 as unhealthy.
# A 503 here would get a slow first boot (long migrations) killed by the
# restart policy; 500 keeps the container alive while clearly not-ready to
# external monitors expecting 200.
#
# /healthcheck must stay ungated: it is php-fpm's ping.path (answered inside
# FPM — no application code, no DB), and the base image's s6 readiness check
# for the nginx service curls it with --fail. Gating it leaves that service
# "starting" forever, and with S6_CMD_WAIT_FOR_SERVICES_MAXTIME=0 s6 never
# settles stage 2 — which also blocks S6_BEHAVIOUR_IF_STAGE2_FAILS=2 from
# halting the container when the bootstrap oneshot fails (DB timeout,
# wrong-DB refusal), breaking the exit-on-failure contract.
# The exemption hardcodes the base's default HEALTHCHECK_PATH=/healthcheck;
# overriding that env is unsupported in this image (the moved ping path would
# be gated and the s6 readiness check would never pass).
#
# Server-level `if`/`set` run in the rewrite phase, before location matching,
# so this preempts every location including the PHP handlers.
set $freescout_boot_gate "";
if (-f /var/www/html/.freescout-bootstrap-incomplete) {
    set $freescout_boot_gate 1;
}
if ($uri = /healthcheck) {
    set $freescout_boot_gate "";
}
if ($freescout_boot_gate) {
    return 500 "FreeScout is starting (waiting for the database / running migrations). Retry shortly.";
}
